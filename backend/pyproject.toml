[project]
name = "riqchariy-backend"
version = "0.1.0"
description = "API de Riqchariy — motor de simulación financiera (Pacha), auth, minijuegos y chatbot Qori"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Config y validación
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.7",  # NoDecode requiere >=2.7
    "pyyaml>=6.0",             # content/balance.yaml, items, jobs
    # Base de datos
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",    # driver de PostgreSQL (URL: postgresql+psycopg://)
    "pgvector>=0.3",           # embeddings para RAG de Qori
    # Cache y rate limiting
    "redis>=5.0",
    "slowapi>=0.1.9",
    # Auth
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    # Chatbot
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
